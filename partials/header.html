<header class="sticky top-0 z-20 border-b border-gray-200 bg-white/90 backdrop-blur">
  <div class="mx-auto flex max-w-5xl items-center gap-6 px-4 py-3">

    <a href="/" class="text-sm font-bold uppercase tracking-widest text-gray-900">Shop</a>

    <nav class="flex items-center gap-4 text-sm">
      <a
        href="/"
        class="transition-colors hover:text-gray-900"
        :class="$router.context.path === '/' ? 'font-medium text-brand-text' : 'text-gray-500'"
      >Products</a>

      <template x-if="$store.session.user?.admin">
        <a href="/admin" class="text-gray-500 transition-colors hover:text-gray-900">Admin</a>
      </template>
    </nav>

    <div class="ml-auto flex items-center gap-3">

      <!-- The icon shows where a click goes: the moon on the light page, the sun on the dark. -->
      <button
        type="button"
        class="rounded-lg p-1.5 text-gray-500 transition-colors hover:text-gray-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-focus focus-visible:ring-offset-2"
        :aria-label="$store.theme.dark ? 'Switch to light mode' : 'Switch to dark mode'"
        @click="$store.theme.toggle()"
      >
        <svg x-show="!$store.theme.dark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="h-5 w-5"
             fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
        </svg>
        <svg x-show="$store.theme.dark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="h-5 w-5"
             fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
        </svg>
      </button>

      <a
        href="/cart"
        class="relative rounded-lg p-1.5 transition-colors hover:text-gray-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-focus focus-visible:ring-offset-2"
        :class="$router.context.path === '/cart' ? 'text-brand-text' : 'text-gray-500'"
        :aria-label="`Cart, ${$store.cart.count} ${$store.cart.count === 1 ? 'item' : 'items'}`"
      >
        <!-- Inline, not <img>: only this way does the icon follow currentColor. -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="h-5 w-5" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="M2.75 3.75h1.3a1 1 0 0 1 .98.79l.47 1.71" />
          <path d="M5.5 6.25h14.2l-1.7 7.2a1.5 1.5 0 0 1-1.46 1.15H8.9a1.5 1.5 0 0 1-1.47-1.19Z" />
          <circle cx="9.5" cy="18" r="1.4" />
          <circle cx="16.5" cy="18" r="1.4" />
        </svg>

        <span
          x-show="$store.cart.count > 0"
          x-text="$store.cart.count"
          x-transition.scale.duration.200ms
          class="badge-count badge-brand absolute -right-0.5 -top-0.5"
        ></span>
      </a>

      <template x-if="$store.session.user">
        <div class="flex items-center gap-3">
          <a
            href="/account"
            class="muted hidden transition-colors hover:text-gray-900 sm:inline"
            :class="$router.context.path === '/account' && 'font-medium text-brand-text'"
            x-text="$store.session.user.name"
          ></a>
          <button type="button" class="btn btn-ghost btn-sm" @click="signOut()">Sign out</button>
        </div>
      </template>

      <template x-if="!$store.session.user">
        <a href="/login" class="btn btn-primary btn-sm">Sign in</a>
      </template>
    </div>

  </div>
</header>
