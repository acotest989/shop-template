<!-- The admin area's chrome, in place of the shop's header on every /admin route (main.js).
     The tabs are drawn for an admin only; the pages under them say no to anybody else. -->
<header class="sticky top-0 z-20 border-b border-gray-200 bg-white/90 backdrop-blur">
  <div class="mx-auto flex max-w-6xl flex-wrap items-center gap-x-6 gap-y-2 px-4 py-3">

    <a href="/admin" class="text-sm font-bold uppercase tracking-widest text-gray-900">
      Shop <span class="font-medium normal-case tracking-normal text-gray-500">admin</span>
    </a>

    <!-- A row of its own on a phone, under the name and the way back, so no tab is squeezed out.
         A tab stays lit on the pages under it, a product's own page under Products; Overview
         only on its own, or it would be lit everywhere. -->
    <nav
      x-show="$store.session.user?.admin"
      x-data="{
        here(href) {
          const path = this.$router.context.path;
          return href === '/admin' ? path === href : path === href || path.startsWith(href + '/');
        },
      }"
      class="order-last -mx-1 flex w-full gap-1 overflow-x-auto text-sm sm:order-none sm:mx-0 sm:w-auto"
      aria-label="Admin"
    >
      <template
        x-for="tab in [
          { href: '/admin', label: 'Overview' },
          { href: '/admin/inbox', label: 'Inbox' },
          { href: '/admin/orders', label: 'Orders' },
          { href: '/admin/products', label: 'Products' },
        ]"
        :key="tab.href"
      >
        <a
          :href="tab.href"
          class="shrink-0 rounded-lg px-3 py-1.5 transition-colors"
          :class="here(tab.href) ? 'bg-gray-100 font-medium text-gray-900' : 'text-gray-500 hover:text-gray-900'"
          :aria-current="here(tab.href) ? 'page' : null"
          x-text="tab.label"
        ></a>
      </template>
    </nav>

    <div class="ml-auto flex items-center gap-3">
      <button
        type="button"
        class="rounded-lg p-1.5 text-gray-500 transition-colors hover:text-gray-900 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-focus focus-visible:ring-offset-2"
        :aria-label="$store.theme.dark ? 'Switch to light mode' : 'Switch to dark mode'"
        @click="$store.theme.toggle()"
      >
        <svg x-show="!$store.theme.dark" viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
        </svg>
        <svg x-show="$store.theme.dark" viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
        </svg>
      </button>

      <a href="/" class="muted transition-colors hover:text-gray-900">Back to shop</a>
    </div>

  </div>
</header>
