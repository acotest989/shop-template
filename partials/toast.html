<div
  x-show="errMsg"
  x-transition:enter="transition duration-300 ease-out"
  x-transition:enter-start="opacity-0 -translate-y-4 scale-95"
  x-transition:leave="transition duration-200 ease-in"
  x-transition:leave-end="opacity-0 -translate-y-4 scale-95"
  role="alert"
  class="fixed inset-x-4 top-4 z-30 mx-auto flex max-w-lg items-center gap-4
         rounded-xl border-l-4 border-red-500 bg-red-200 p-4 shadow-xl shadow-red-900/10 ring-1 ring-red-300"
>
  <span class="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-red-100 text-red-600">
    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
    </svg>
  </span>

  <div class="min-w-0 flex-1">
    <p class="text-xs font-semibold uppercase tracking-wider text-red-600">Error</p>
    <p class="text-base font-medium leading-snug text-red-800" x-text="errMsg"></p>
  </div>

  <button
    type="button"
    @click="errMsg = ''"
    aria-label="Close"
    class="shrink-0 cursor-pointer rounded-lg p-1.5 text-red-600 transition hover:bg-red-100 hover:text-red-700
           focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-500"
  >
    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
    </svg>
  </button>
</div>
