<!DOCTYPE html>
<html lang="{{language}}">
<!-- The frame of every mail the shop sends: the shop's name above, where it came from below,
     and the mail itself in between as {{{content}}}. Written for mail programs rather than
     browsers, so tables and inline styles: plenty of them read nothing else. -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f4f6;">
  <!-- The line an inbox shows under the subject: the mail's own start, filled in by mailer.js.
       Hidden in the mail itself. -->
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;font-size:1px;line-height:1px;color:#f3f4f6;">{{preheader}}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f3f4f6;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;background-color:#ffffff;border:1px solid #e5e7eb;border-radius:12px;">
          <tr>
            <td style="padding:18px 28px;border-bottom:1px solid #e5e7eb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#111827;">
              {{shopName}}
            </td>
          </tr>
          <tr>
            <td style="padding:24px 28px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#374151;">
              {{{content}}}
            </td>
          </tr>
        </table>
        <p style="margin:16px 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.5;color:#6b7280;">
          {{shopName}} · <a href="{{appURL}}" style="color:#6b7280;">{{appURL}}</a>
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
