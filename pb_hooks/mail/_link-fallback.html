<!-- Under a button, its address spelled out, for a mail program that draws no button or a reader
     who would rather copy it. A part, taken in with {{> link-fallback}}, and it shows {{link}}.
     data-html-only keeps it out of the plain-text version, where the button's own line already
     carries the address. -->
<p data-html-only style="font-size:13px;line-height:1.5;color:#6b7280;">If the button does not work, open this address:<br><a href="{{link}}" style="color:#6b7280;word-break:break-all;">{{link}}</a></p>
