<main class="mx-auto w-full max-w-5xl p-4" x-data="homePage">
  <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-baseline gap-2">
      <h1 class="text-xl font-semibold text-gray-900" x-text="t('home.title')"></h1>
      <span class="muted" x-show="!pending && !error" x-text="range"></span>
    </div>

    <div class="flex w-full flex-wrap items-center gap-3 sm:w-auto">

      <!-- x-effect, not x-model alone: the options arrive after the select is bound, and a
           browser does not select an option that did not exist when the value was set. -->
      <select
        x-model="category"
        x-effect="categories.length && ($el.value = category)"
        :aria-label="t('home.filterCategory')"
        class="input w-full sm:w-44"
      >
        <option value="" x-text="t('home.allCategories')"></option>
        <template x-for="option in categories" :key="option.value">
          <option :value="option.value" x-text="option.label"></option>
        </template>
      </select>

      <div class="relative w-full sm:w-64">
        <input
          x-ref="search"
          x-model.debounce.250ms="q"
          type="search"
          :placeholder="t('home.searchPlaceholder')"
          :aria-label="t('home.searchLabel')"
          class="input pr-8"
        >
        <button
          type="button"
          x-show="q"
          @click="clear()"
          :aria-label="t('home.clearSearch')"
          class="absolute inset-y-0 right-0 px-2 text-lg leading-none text-gray-400 transition-colors hover:text-gray-900"
        >&times;</button>
      </div>

    </div>
  </div>

  <!-- loading -->
  <template x-if="pending">
    <div class="grid grid-cols-2 gap-4 md:grid-cols-3" aria-hidden="true">
      <template x-for="n in skeletonCount" :key="n">
        <div class="card flex h-full flex-col overflow-hidden">
          <div class="skeleton aspect-square w-full rounded-none"></div>
          <div class="flex flex-1 flex-col p-3">
            <div class="skeleton h-2 w-1/3"></div>
            <div class="skeleton mt-2 h-3 w-4/5"></div>
            <div class="skeleton mt-1.5 h-3 w-3/5"></div>
            <div class="skeleton mt-3 h-4 w-1/4"></div>
            <div class="mt-auto pt-3">
              <div class="skeleton h-9 w-full rounded-lg"></div>
            </div>
          </div>
        </div>
      </template>
    </div>
  </template>

  <!-- error -->
  <template x-if="error">
    <p class="rounded-lg bg-red-50 p-4 text-center text-sm font-medium text-red-600" x-text="error"></p>
  </template>

  <!-- empty -->
  <template x-if="isEmpty">
    <div class="p-8 text-center">
      <p class="muted" x-text="q ? t('home.noMatch', { q }) : t('home.none')"></p>
      <button type="button" x-show="q" class="btn btn-ghost mt-4" @click="clear()" x-text="t('home.clearSearch')"></button>
    </div>
  </template>

  <!-- list -->
  <template x-if="!pending && !error && !isEmpty">
    <div class="grid grid-cols-2 gap-4 transition-opacity duration-200 md:grid-cols-3" :class="searching && 'opacity-60'">
      <template x-for="product in products" :key="product.id">
        <div x-html="partials.card"></div>
      </template>
    </div>
  </template>

  <!-- paging -->
  <nav
    x-show="!pending && !error && totalPages > 1"
    :aria-label="t('paging.label')"
    class="mt-6 flex flex-wrap items-center justify-center gap-1"
  >
    <button
      type="button"
      class="btn btn-ghost btn-sm w-9 px-0 disabled:text-gray-300"
      :disabled="page === 1"
      :aria-label="t('paging.previous')"
      @click="goToPage(page - 1)"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4" aria-hidden="true">
        <path d="m15.75 19.5-7.5-7.5 7.5-7.5" />
      </svg>
    </button>

    <template x-for="n in totalPages" :key="n">
      <button
        type="button"
        class="btn btn-sm w-9"
        :class="n === page ? 'btn-primary' : 'btn-ghost'"
        :aria-current="n === page ? 'page' : false"
        :aria-label="t('paging.page', { n })"
        x-text="n"
        @click="goToPage(n)"
      ></button>
    </template>

    <button
      type="button"
      class="btn btn-ghost btn-sm w-9 px-0 disabled:text-gray-300"
      :disabled="page === totalPages"
      :aria-label="t('paging.next')"
      @click="goToPage(page + 1)"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4" aria-hidden="true">
        <path d="m8.25 4.5 7.5 7.5-7.5 7.5" />
      </svg>
    </button>
  </nav>
</main>
