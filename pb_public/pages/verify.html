<main class="flex flex-1 items-center justify-center p-4" x-data="verifyPage">
  <div class="card w-full max-w-sm p-6 text-center">

    <template x-if="pending">
      <div>
        <div class="skeleton mx-auto h-3 w-32"></div>
        <div class="skeleton mx-auto mt-3 h-3 w-48"></div>
      </div>
    </template>

    <template x-if="!pending && !error">
      <div>
        <p class="eyebrow" x-text="t('verify.done')"></p>
        <h1 class="mt-2 text-lg font-semibold text-gray-900" x-text="t('verify.yours')"></h1>
        <p class="muted mt-2" x-text="t('verify.confirmed')"></p>
        <button type="button" class="btn btn-primary mt-6 w-full" @click="goTo('/')" x-text="t('checkout.continue')"></button>
      </div>
    </template>

    <template x-if="error">
      <div>
        <p class="eyebrow" x-text="t('verify.failed')"></p>
        <h1 class="mt-2 text-lg font-semibold text-gray-900" x-text="error"></h1>
        <p class="muted mt-2" x-text="t('verify.newLink')"></p>
        <button type="button" class="btn btn-primary mt-6 w-full" @click="goTo('/login')" x-text="t('nav.signIn')"></button>
      </div>
    </template>

  </div>
</main>
