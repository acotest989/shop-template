<main class="mx-auto w-full max-w-6xl p-4" x-data="adminInboxPage">

  <template x-if="allowed">
    <div>
      <div class="mb-4 flex items-center gap-3">
        <h1 class="text-xl font-semibold text-gray-900" x-text="t('admin.inbox.title')"></h1>
        <span x-show="waitingCount" class="badge badge-warn" x-text="t('admin.inbox.waitingCount', { n: waitingCount })"></span>
      </div>

      <!-- The live connection never came up: a proxy or network in between holds it back. The
           inbox works without it; it only stops noticing what arrives. -->
      <p x-show="liveLate" class="mb-4 rounded-lg bg-amber-50 px-3 py-2 text-sm text-amber-700" x-text="t('admin.inbox.notLive')"></p>

      <p x-show="error" x-text="error" role="alert" class="mb-4 rounded-lg bg-red-50 p-4 text-sm font-medium text-red-600"></p>

      <!-- Two panes from md up. Below that the list and the conversation take turns, and the
           address says which: a conversation is open while ?thread= is there. -->
      <div class="grid gap-4 md:grid-cols-[20rem_1fr]">

        <section
          class="card flex h-[calc(100dvh_-_10rem)] min-h-96 flex-col overflow-hidden"
          :class="selectedId && 'max-md:hidden'"
          :aria-label="t('admin.inbox.conversations')"
        >
          <div class="flex gap-1 border-b border-gray-200 p-2">
            <button
              type="button"
              class="btn btn-sm flex-1"
              :class="filter === 'waiting' ? 'bg-gray-100 text-gray-900' : 'text-gray-500 hover:text-gray-900'"
              :aria-pressed="filter === 'waiting'"
              @click="filter = 'waiting'"
              x-text="t('admin.inbox.waiting')"
            ></button>
            <button
              type="button"
              class="btn btn-sm flex-1"
              :class="filter === 'all' ? 'bg-gray-100 text-gray-900' : 'text-gray-500 hover:text-gray-900'"
              :aria-pressed="filter === 'all'"
              @click="filter = 'all'"
              x-text="t('admin.inbox.all')"
            ></button>
          </div>

          <div x-show="pending" class="flex flex-col gap-4 p-3" aria-hidden="true">
            <template x-for="row in 5" :key="row">
              <div class="flex gap-3">
                <div class="skeleton h-10 w-10 rounded-lg"></div>
                <div class="flex-1">
                  <div class="skeleton h-3 w-1/2"></div>
                  <div class="skeleton mt-2 h-2 w-3/4"></div>
                </div>
              </div>
            </template>
          </div>

          <p
            x-show="!pending && !shown.length"
            class="muted m-auto p-6 text-center"
            x-text="filter === 'waiting' ? t('admin.inbox.noneWaiting') : t('admin.inbox.none')"
          ></p>

          <ul class="flex-1 divide-y divide-gray-200 overflow-y-auto overscroll-contain" x-show="!pending && shown.length">
            <template x-for="thread in shown" :key="thread.id">
              <li>
                <button
                  type="button"
                  class="flex w-full gap-3 px-3 py-3 text-left transition-colors hover:bg-gray-50"
                  :class="thread.id === selectedId && 'bg-gray-50'"
                  :aria-current="thread.id === selectedId"
                  @click="open(thread.id)"
                >
                  <span class="light-palette h-10 w-10 shrink-0 overflow-hidden rounded-lg bg-gray-100">
                    <img x-show="thread.product" :src="thread.product?.image" alt="" width="40" height="40" loading="lazy" class="h-full w-full object-cover">
                  </span>

                  <span class="min-w-0 flex-1">
                    <span class="flex items-baseline gap-2">
                      <span class="truncate text-sm font-medium text-gray-900" x-text="thread.customer?.name ?? t('admin.inbox.guest')"></span>
                      <span class="ml-auto shrink-0 text-xs text-gray-400" x-text="when(thread.lastMessageAt)"></span>
                    </span>
                    <span class="block truncate text-xs text-gray-500" x-text="thread.subject"></span>
                    <span class="mt-0.5 flex items-center gap-2">
                      <span
                        class="min-w-0 flex-1 truncate text-xs"
                        :class="thread.waiting ? 'font-medium text-gray-900' : 'text-gray-500'"
                        x-text="thread.preview"
                      ></span>
                      <span x-show="thread.waiting" class="h-2 w-2 shrink-0 rounded-full bg-amber-500"></span>
                      <span x-show="thread.waiting" class="sr-only" x-text="t('admin.inbox.waitingLabel')"></span>
                    </span>
                  </span>
                </button>
              </li>
            </template>
          </ul>

          <!-- At the foot of the list, however many conversations scroll above it. The question
               says how much goes, and how much of it nobody has answered, before anything does. -->
          <div x-show="!pending && threads.length" class="mt-auto border-t border-gray-200 p-2">
            <button
              x-show="!confirmingClear"
              type="button"
              class="btn btn-ghost btn-sm w-full text-gray-500 hover:border-red-300 hover:text-red-600"
              @click="confirmingClear = true"
            >
              <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
              </svg>
              <span x-text="t('admin.inbox.clear')"></span>
            </button>

            <div x-show="confirmingClear" class="rounded-lg bg-red-50 p-2">
              <p class="text-sm text-red-700">
                <span
                  class="font-medium"
                  x-text="t('admin.inbox.clearConfirm', { n: threads.length })"
                ></span>
                <span x-show="waitingCount" x-text="t('admin.inbox.clearWaiting', { n: waitingCount })"></span>
              </p>
              <div class="mt-2 flex gap-2">
                <button
                  type="button"
                  class="btn btn-sm flex-1 bg-red-600 text-white hover:bg-red-500"
                  :disabled="clearing"
                  @click="clear()"
                  x-text="clearing ? t('common.deleting') : t('admin.inbox.clearYes')"
                ></button>
                <button type="button" class="btn btn-ghost btn-sm flex-1" :disabled="clearing" @click="confirmingClear = false" x-text="t('admin.common.cancel')"></button>
              </div>
            </div>
          </div>
        </section>

        <section
          class="card flex h-[calc(100dvh_-_10rem)] min-h-96 flex-col overflow-hidden"
          :class="!selectedId && 'max-md:hidden'"
          :aria-label="t('admin.inbox.conversation')"
        >
          <p x-show="!selected" class="muted m-auto p-6 text-center" x-text="t('admin.inbox.pick')"></p>

          <template x-if="selected">
            <div class="flex min-h-0 flex-1 flex-col">
              <header class="flex items-center gap-3 border-b border-gray-200 p-3">
                <button type="button" class="btn btn-ghost btn-sm md:hidden" :aria-label="t('admin.inbox.backToList')" @click="open('')">
                  <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
                  </svg>
                </button>

                <div class="min-w-0 flex-1">
                  <p class="truncate text-sm font-semibold text-gray-900">
                    <span x-text="selected.customer?.name ?? t('admin.inbox.guest')"></span>
                    <span x-show="selected.customer" class="font-normal text-gray-500" x-text="selected.customer?.email"></span>
                  </p>
                  <p class="truncate text-xs text-gray-500">
                    <a
                      x-show="selected.product"
                      :href="'/products/' + selected.product?.handle"
                      class="underline underline-offset-2 transition-colors hover:text-gray-900"
                      x-text="selected.subject"
                    ></a>
                    <span x-show="!selected.product" x-text="t('admin.inbox.noLongerSold', { title: selected.subject })"></span>
                    <!-- The first characters of the browser's id: the same code on two conversations
                         is the same browser. -->
                    · <span x-text="t('admin.inbox.browser')"></span> <span class="font-mono" x-text="selected.visitor.slice(0, 8)"></span>
                    <span x-show="sameBrowser(selected)" x-text="'· ' + t('admin.inbox.moreFromIt', { n: sameBrowser(selected) })"></span>
                  </p>
                </div>

                <button x-show="selected.waiting" type="button" class="btn btn-ghost btn-sm shrink-0" @click="answered()" x-text="t('admin.inbox.markAnswered')"></button>

                <button
                  type="button"
                  class="btn btn-ghost btn-sm shrink-0 px-2 text-gray-500 hover:border-red-300 hover:text-red-600"
                  :aria-label="t('admin.inbox.delete')"
                  :aria-expanded="confirmingDelete"
                  @click="confirmingDelete = !confirmingDelete"
                >
                  <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                  </svg>
                </button>
              </header>

              <!-- Nothing brings a deleted conversation back, so the button only asks. -->
              <div x-show="confirmingDelete" class="flex flex-wrap items-center gap-3 border-b border-red-200 bg-red-50 px-3 py-2">
                <p class="min-w-0 flex-1 text-sm font-medium text-red-700" x-text="t('admin.inbox.deleteConfirm')"></p>
                <button
                  type="button"
                  class="btn btn-sm bg-red-600 text-white hover:bg-red-500"
                  :disabled="deleting"
                  @click="remove()"
                  x-text="deleting ? t('common.deleting') : t('common.yesDelete')"
                ></button>
                <button type="button" class="btn btn-ghost btn-sm" :disabled="deleting" @click="confirmingDelete = false" x-text="t('admin.common.cancel')"></button>
              </div>

              <div id="inbox-log" class="flex flex-1 flex-col gap-3 overflow-y-auto overscroll-contain p-4" aria-live="polite">
                <p x-show="loadingMessages" class="self-center py-2 text-xs text-gray-400" x-text="t('chat.loading')"></p>
                <p x-show="messagesError" x-text="messagesError" role="alert" class="rounded-lg bg-red-50 p-3 text-sm font-medium text-red-600"></p>

                <template x-for="message in messages" :key="message.id">
                  <div class="flex max-w-[80%] flex-col" :class="message.from === 'shop' ? 'items-end self-end' : 'items-start self-start'">
                    <p
                      class="whitespace-pre-line rounded-2xl px-3 py-2 text-sm"
                      :class="message.from === 'shop' ? 'rounded-br-md bg-brand text-brand-ink' : 'rounded-bl-md bg-gray-100 text-gray-900'"
                      x-text="message.text"
                    ></p>
                    <!-- A pick was answered by the list on the spot, so it is marked rather than
                         left looking like a question nobody took up. -->
                    <span class="mt-1 text-[11px] text-gray-400" x-text="(message.faq ? t('admin.inbox.picked') + ' · ' : '') + timeOf(message.sentAt)"></span>
                  </div>
                </template>
              </div>

              <form class="border-t border-gray-200 p-3" @submit.prevent="send()" novalidate>
                <p x-show="!selected.customer" class="mb-2 text-xs text-gray-500" x-text="t('admin.inbox.guestNote')"></p>

                <label for="inbox-draft" class="sr-only" x-text="t('admin.inbox.yourReply')"></label>
                <textarea
                  id="inbox-draft"
                  rows="3"
                  :placeholder="t('admin.inbox.replyPlaceholder')"
                  x-model="draft"
                  :maxlength="maxLength"
                  :disabled="sending"
                  @input="sendError = ''"
                  @keydown.enter="if (!$event.shiftKey && !$event.isComposing) { $event.preventDefault(); send(); }"
                  class="input resize-none"
                ></textarea>

                <p x-show="sendError" x-text="sendError" role="alert" class="mt-2 text-xs text-red-600"></p>

                <div class="mt-2 flex items-center justify-end gap-3">
                  <span class="text-xs tabular-nums text-gray-400" x-text="draft.length + '/' + maxLength"></span>
                  <button
                    type="submit"
                    class="btn btn-primary btn-sm"
                    :disabled="sending || !draft.trim()"
                    x-text="sending ? t('common.sending') : t('common.send')"
                  ></button>
                </div>
              </form>
            </div>
          </template>
        </section>

      </div>
    </div>
  </template>

</main>
