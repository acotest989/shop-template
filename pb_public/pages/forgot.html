<main class="flex flex-1 items-center justify-center p-4" x-data="forgotPage">

  <template x-if="sent">
    <div class="card w-full max-w-sm p-6 text-center">
      <p class="eyebrow" x-text="t('forgot.checkInbox')"></p>
      <h1 class="mt-2 text-lg font-semibold text-gray-900" x-text="t('forgot.onItsWay')"></h1>
      <p class="muted mt-2" x-text="t('forgot.ifAccount', { email: values.email })"></p>
      <button type="button" class="btn btn-ghost mt-6 w-full" @click="goTo('/login')" x-text="t('forgot.backToSignIn')"></button>
    </div>
  </template>

  <template x-if="!sent">
    <div class="card w-full max-w-sm p-6">
      <h1 class="text-lg font-semibold text-gray-900" x-text="t('forgot.title')"></h1>
      <p class="muted mt-1" x-text="t('forgot.intro')"></p>

      <form class="mt-5 flex flex-col gap-4" @submit.prevent="submit()" novalidate>
        <div>
          <label for="email" class="label" x-text="t('common.email')"></label>
          <input
            id="email"
            x-init="$el.focus()"
            type="email"
            autocomplete="email"
            :placeholder="t('checkout.emailPlaceholder')"
            x-model="values.email"
            @input="clear('email')"
            :disabled="pending"
            class="input mt-1"
            :class="(errors.email || error) && 'border-red-400'"
          >
          <p class="mt-1 text-xs text-red-600" x-show="errors.email || error" x-text="errors.email || error"></p>
        </div>

        <button
          type="submit"
          class="btn btn-primary w-full"
          :disabled="pending"
          x-text="pending ? t('common.sending') : t('forgot.submit')"
        ></button>
      </form>

      <p class="muted mt-5 text-center">
        <a href="/login" class="font-medium text-gray-900 underline underline-offset-2" x-text="t('forgot.backToSignIn')"></a>
      </p>
    </div>
  </template>

</main>
