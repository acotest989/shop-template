<main class="mx-auto w-full max-w-2xl p-4" x-data="accountPage">
  <h1 class="mb-4 text-xl font-semibold text-gray-900" x-text="t('account.title')"></h1>

  <div class="flex flex-col gap-4">

    <!-- unverified notice -->
    <template x-if="!verified">
      <div class="card flex flex-wrap items-center justify-between gap-3 border-amber-200 bg-amber-50 p-4">
        <p class="text-sm text-amber-800">
          <span class="font-medium" x-text="t('account.notVerified')"></span>
        </p>
        <button
          type="button"
          class="btn btn-ghost btn-sm"
          x-show="!resent"
          @click="resendVerification()"
          x-text="t('account.sendAgain')"
        ></button>
      </div>
    </template>

    <!-- orders -->
    <section class="card p-4">
      <p class="label" x-text="t('account.orders')"></p>

      <p class="muted mt-3 text-sm" x-show="orders.pending" x-text="t('common.loading')"></p>
      <p class="mt-3 text-sm text-red-600" x-show="orders.error" x-text="orders.error"></p>
      <p class="muted mt-3 text-sm" x-show="!orders.pending && !orders.error && !orders.items.length" x-text="t('account.noOrders')"></p>

      <ul class="mt-1 divide-y divide-gray-200" x-show="orders.items.length">
        <template x-for="order in orders.items" :key="order.id">
          <li class="flex flex-wrap items-center justify-between gap-x-4 gap-y-2 py-3">
            <div class="min-w-0 flex-1">
              <p class="font-mono text-sm text-gray-900" x-text="order.reference"></p>
              <p
                class="muted mt-0.5 truncate text-xs"
                x-text="formatDate(order.placedAt) + ' — ' + order.lines.map(line => line.title + ' ×' + line.qty).join(', ')"
              ></p>
            </div>

            <!-- Two badges because they answer two questions: where it is, and whether
                 it is settled. Cash on delivery is what makes those come apart. A delivered
                 parcel was paid for at the door, whether or not the courier has passed the
                 money on yet, and an order that ended owes nothing, so it asks for nothing. -->
            <div class="flex shrink-0 items-center gap-2">
              <span
                class="badge"
                :class="{
                  'badge-soft': order.status === 'pending' || order.status === 'shipped',
                  'badge-good': order.status === 'delivered',
                  'badge-bad': order.status === 'cancelled' || order.status === 'returned',
                }"
                x-text="t('status.' + order.status)"
              ></span>
              <span
                class="badge"
                x-show="order.status !== 'cancelled' && order.status !== 'returned'"
                :class="order.paid || order.status === 'delivered' ? 'badge-good' : 'badge-warn'"
                x-text="order.paid || order.status === 'delivered' ? t('account.paid') : t('account.payOnDelivery')"
              ></span>
              <span class="text-sm font-semibold text-gray-900" x-text="money(order.total, order.currency)"></span>
            </div>
          </li>
        </template>
      </ul>
    </section>

    <!-- name -->
    <section class="card p-4">
      <p class="label" x-text="t('account.name')"></p>
      <form class="mt-3 flex flex-wrap items-start gap-3" @submit.prevent="saveName()" novalidate>
        <div class="min-w-48 flex-1">
          <input
            type="text"
            autocomplete="name"
            :aria-label="t('account.name')"
            x-model="profile.name"
            @input="profile.error = ''; profile.saved = false"
            :disabled="profile.pending"
            class="input"
            :class="profile.error && 'border-red-400'"
          >
          <p class="mt-1 text-xs text-red-600" x-show="profile.error" x-text="profile.error"></p>
        </div>
        <button
          type="submit"
          class="btn btn-primary"
          :disabled="profile.pending"
          x-text="profile.pending ? t('common.saving') : t('common.save')"
        ></button>
      </form>
    </section>

    <!-- email -->
    <section class="card p-4">
      <p class="label" x-text="t('common.email')"></p>
      <p class="muted mt-1 text-sm" x-text="t('account.currentEmail', { email: $store.session.user?.email })"></p>

      <template x-if="emailChange.sent">
        <p class="muted mt-3 text-sm" x-text="t('account.emailLinkSent', { email: emailChange.email })"></p>
      </template>

      <template x-if="!emailChange.sent">
        <form class="mt-3 flex flex-wrap items-start gap-3" @submit.prevent="sendEmailChange()" novalidate>
          <div class="min-w-48 flex-1">
            <input
              type="email"
              autocomplete="email"
              :aria-label="t('account.newEmail')"
              placeholder="new@example.com"
              x-model="emailChange.email"
              @input="emailChange.error = ''"
              :disabled="emailChange.pending"
              class="input"
              :class="emailChange.error && 'border-red-400'"
            >
            <p class="mt-1 text-xs text-red-600" x-show="emailChange.error" x-text="emailChange.error"></p>
          </div>
          <button
            type="submit"
            class="btn btn-ghost"
            :disabled="emailChange.pending"
            x-text="emailChange.pending ? t('common.sending') : t('account.changeEmail')"
          ></button>
        </form>
      </template>
    </section>

    <!-- password -->
    <section class="card p-4">
      <p class="label" x-text="t('common.password')"></p>
      <p class="muted mt-1 text-sm" x-text="t('account.passwordNote')"></p>

      <form class="mt-3 flex flex-col gap-3" @submit.prevent="savePassword()" novalidate>
        <div>
          <input
            type="password"
            autocomplete="current-password"
            :aria-label="t('account.currentPassword')"
            :placeholder="t('account.currentPassword')"
            x-model="password.old"
            @input="password.errors.old = ''; password.error = ''"
            :disabled="password.pending"
            class="input"
            :class="password.errors.old && 'border-red-400'"
          >
          <p class="mt-1 text-xs text-red-600" x-show="password.errors.old" x-text="password.errors.old"></p>
        </div>

        <div class="flex flex-wrap gap-3">
          <div class="min-w-48 flex-1">
            <input
              type="password"
              autocomplete="new-password"
              :aria-label="t('reset.newPassword')"
              :placeholder="t('reset.newPassword')"
              x-model="password.next"
              @input="password.errors.next = ''"
              :disabled="password.pending"
              class="input"
              :class="password.errors.next && 'border-red-400'"
            >
            <p class="mt-1 text-xs text-red-600" x-show="password.errors.next" x-text="password.errors.next"></p>
          </div>
          <div class="min-w-48 flex-1">
            <input
              type="password"
              autocomplete="new-password"
              :aria-label="t('account.repeatNewPassword')"
              :placeholder="t('account.repeatNewPassword')"
              x-model="password.confirm"
              @input="password.errors.confirm = ''"
              :disabled="password.pending"
              class="input"
              :class="password.errors.confirm && 'border-red-400'"
            >
            <p class="mt-1 text-xs text-red-600" x-show="password.errors.confirm" x-text="password.errors.confirm"></p>
          </div>
        </div>

        <p
          x-show="password.error"
          x-text="password.error"
          role="alert"
          aria-live="polite"
          class="rounded-lg bg-red-50 px-3 py-2 text-sm font-medium text-red-600"
        ></p>

        <button
          type="submit"
          class="btn btn-primary self-start"
          :disabled="password.pending"
          x-text="password.pending ? t('account.changing') : t('account.changePassword')"
        ></button>
      </form>
    </section>

    <!-- delete -->
    <section class="card border-red-200 p-4">
      <p class="label text-red-500" x-text="t('account.delete')"></p>

      <template x-if="!danger.confirming">
        <div class="mt-1">
          <p class="muted text-sm" x-text="t('account.deleteNote')"></p>
          <button
            type="button"
            class="btn btn-ghost mt-3 border-red-300 text-red-600 hover:bg-red-50"
            @click="danger.confirming = true"
            x-text="t('account.delete')"
          ></button>
        </div>
      </template>

      <template x-if="danger.confirming">
        <div class="mt-1">
          <p class="text-sm font-medium text-red-700" x-text="t('account.deleteConfirm')"></p>
          <p
            x-show="danger.error"
            x-text="danger.error"
            role="alert"
            class="mt-2 rounded-lg bg-red-50 px-3 py-2 text-sm font-medium text-red-600"
          ></p>
          <div class="mt-3 flex flex-wrap gap-3">
            <button
              type="button"
              class="btn bg-red-600 text-white hover:bg-red-500"
              :disabled="danger.pending"
              @click="confirmDelete()"
              x-text="danger.pending ? t('common.deleting') : t('common.yesDelete')"
            ></button>
            <button
              type="button"
              class="btn btn-ghost"
              :disabled="danger.pending"
              @click="danger.confirming = false"
              x-text="t('account.keep')"
            ></button>
          </div>
        </div>
      </template>
    </section>

  </div>
</main>
