<!DOCTYPE html>
<!-- Neither the language nor the accent colour is set here: pb_hooks/lib/site.js
     rewrites lang and data-accent on <html>, the two lang/ entries in the import map, the title
     and the description on every load, from what is chosen in the admin area under Settings.
     As written, English and in ink: what goes out should the server be unable to read this
     file. The colours are in assets/theme.css. -->
<html lang="en" data-accent="none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop</title>
  <meta name="description" content="A small demo storefront built with Alpine and Tailwind — no framework, no build step.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <!-- Runs before the first paint, so a visitor who chose dark, or whose system is dark and
       who has not chosen, never sees the light page first. The key is storageKey('theme')
       from lib/shop.js; nothing that could import it loads this early. -->
  <script>
    {
      let saved = null;
      try { saved = localStorage.getItem('shop_theme'); } catch (err) { /* blocked: follow the system */ }
      if (saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark');
      }
    }
  </script>

  <link rel="stylesheet" href="/assets/main.css">
  <link rel="preload" href="/assets/theme.css" as="fetch" crossorigin>

  <!-- Every dependency of this app and its version, in one place. A bare specifier
       can only resolve one way, so no file can load a second copy by accident.
       Swap the framework URL for /alpineshell/index.js to work on it locally.
       lang/shop and lang/admin are the shop's language: lib/i18n.js imports the one and
       fetches the other for an admin. -->
  <script type="importmap">
  {
    "imports": {
      "alpineshell": "https://cdn.jsdelivr.net/gh/acotest989/alpineshell@v0.5.7/index.js",
      "pocketbase": "https://cdn.jsdelivr.net/npm/pocketbase@0.28.1/dist/pocketbase.es.mjs",
      "lang/shop": "/lang/en/shop.js",
      "lang/admin": "/lang/en/admin.js"
    }
  }
  </script>

  <script type="module" src="/main.js" defer></script>
</head>
<body class="bg-gray-50">
  <div id="app" x-data="app" x-cloak>

    <div x-html="partials.toast"></div>

    <div id="page" class="flex flex-col min-h-screen"></div>

    <div x-html="partials.scrolltop"></div>

  </div>
</body>
</html>
