<title>Login from a new location</title>
<!-- PocketBase's own mail when an account signs in from somewhere it has not before:
     server/pb_hooks/mail.pb.js swaps its text for this. {{info}} is PocketBase's description
     of where the sign-in came from. -->
<p>Hello,</p>
<p>We noticed a login to your {{shopName}} account from a new location:</p>
<p><em>{{info}}</em></p>
<p><strong>If this wasn't you, you should immediately change your {{shopName}} account password to revoke access from all other locations.</strong></p>
<p>If this was you, you may disregard this email.</p>
<p>Thanks,<br>{{shopName}} team</p>
