<main class="mx-auto w-full max-w-5xl p-4" x-data="homePage">
  <h1 class="mb-4 text-xl font-semibold text-gray-900">Products</h1>

  <!-- loading -->
  <template x-if="pending">
    <div class="grid grid-cols-2 gap-4 md:grid-cols-3" aria-hidden="true">
      <template x-for="n in pageSize" :key="n">
        <div class="card flex h-full flex-col overflow-hidden">
          <div class="skeleton aspect-square w-full rounded-none"></div>
          <div class="flex flex-1 flex-col p-3">
            <div class="skeleton h-2 w-1/3"></div>
            <div class="skeleton mt-2 h-3 w-4/5"></div>
            <div class="skeleton mt-1.5 h-3 w-3/5"></div>
            <div class="skeleton mt-3 h-4 w-1/4"></div>
            <div class="mt-auto pt-3">
              <div class="skeleton h-9 w-full rounded-lg"></div>
            </div>
          </div>
        </div>
      </template>
    </div>
  </template>

  <!-- error -->
  <template x-if="error">
    <p class="rounded-lg bg-red-50 p-4 text-center text-sm font-medium text-red-600" x-text="error"></p>
  </template>

  <!-- empty -->
  <template x-if="isEmpty">
    <p class="muted p-8 text-center">No products found.</p>
  </template>

  <!-- list -->
  <template x-if="!pending && !error && !isEmpty">
    <div class="grid grid-cols-2 gap-4 md:grid-cols-3">
      <template x-for="product in products" :key="product.id">
        <div x-html="partials.card"></div>
      </template>
    </div>
  </template>
</main>
