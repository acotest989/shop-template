<main class="flex flex-1 items-center justify-center p-4" x-data="confirmEmailPage">

  <template x-if="done">
    <div class="card w-full max-w-sm p-6 text-center">
      <p class="eyebrow">Address changed</p>
      <h1 class="mt-2 text-lg font-semibold text-gray-900">Sign in with the new email.</h1>
      <p class="muted mt-2">Changing the address signs out every device that was using the old session.</p>
      <button type="button" class="btn btn-primary mt-6 w-full" @click="goTo('/login')">Sign in</button>
    </div>
  </template>

  <template x-if="!done">
    <div class="card w-full max-w-sm p-6">
      <h1 class="text-lg font-semibold text-gray-900">Confirm your new email</h1>
      <p class="muted mt-1">Your password confirms it is really you.</p>

      <form class="mt-5 flex flex-col gap-4" @submit.prevent="submit()" novalidate>
        <div>
          <label for="password" class="label">Password</label>
          <input
            id="password"
            x-init="$el.focus()"
            type="password"
            autocomplete="current-password"
            x-model="values.password"
            @input="clear('password')"
            :disabled="pending"
            class="input mt-1"
            :class="(errors.password || error) && 'border-red-400'"
          >
          <p class="mt-1 text-xs text-red-600" x-show="errors.password || error" x-text="errors.password || error"></p>
        </div>

        <button
          type="submit"
          class="btn btn-primary w-full"
          :disabled="pending"
          x-text="pending ? 'Confirming…' : 'Confirm'"
        ></button>
      </form>
    </div>
  </template>

</main>
