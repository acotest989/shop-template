<main class="flex flex-1 items-center justify-center p-4" x-data="confirmEmailPage">

  <template x-if="done">
    <div class="card w-full max-w-sm p-6 text-center">
      <p class="eyebrow" x-text="t('confirmEmail.changed')"></p>
      <h1 class="mt-2 text-lg font-semibold text-gray-900" x-text="t('confirmEmail.signInNew')"></h1>
      <p class="muted mt-2" x-text="t('confirmEmail.signedOut')"></p>
      <button type="button" class="btn btn-primary mt-6 w-full" @click="goTo('/login')" x-text="t('nav.signIn')"></button>
    </div>
  </template>

  <template x-if="!done">
    <div class="card w-full max-w-sm p-6">
      <h1 class="text-lg font-semibold text-gray-900" x-text="t('confirmEmail.title')"></h1>
      <p class="muted mt-1" x-text="t('confirmEmail.intro')"></p>

      <form class="mt-5 flex flex-col gap-4" @submit.prevent="submit()" novalidate>
        <div>
          <label for="password" class="label" x-text="t('common.password')"></label>
          <input
            id="password"
            x-init="$el.focus()"
            type="password"
            autocomplete="current-password"
            x-model="values.password"
            @input="clear('password')"
            :disabled="pending"
            class="input mt-1"
            :class="(errors.password || error) && 'border-red-400'"
          >
          <p class="mt-1 text-xs text-red-600" x-show="errors.password || error" x-text="errors.password || error"></p>
        </div>

        <button
          type="submit"
          class="btn btn-primary w-full"
          :disabled="pending"
          x-text="pending ? t('confirmEmail.confirming') : t('confirmEmail.submit')"
        ></button>
      </form>
    </div>
  </template>

</main>
