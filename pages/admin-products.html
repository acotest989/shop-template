<main class="mx-auto w-full max-w-6xl p-4" x-data="adminProductsPage">

  <div class="mb-4 flex flex-wrap items-center gap-3">
    <h1 class="text-xl font-semibold text-gray-900">Products</h1>
    <span x-show="!pending && !error" class="muted" x-text="total === 1 ? '1 product' : total + ' products'"></span>
    <a href="/admin/products/new" class="btn btn-primary btn-sm ml-auto">
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
      New product
    </a>
  </div>

  <div class="mb-4 flex flex-wrap gap-3">
    <div class="relative w-full sm:w-64">
      <input
        x-model.debounce.250ms="q"
        type="search"
        placeholder="Search by name, brand or address…"
        aria-label="Search products"
        class="input pr-8"
      >
      <button
        type="button"
        x-show="q"
        @click="q = ''"
        aria-label="Clear search"
        class="absolute inset-y-0 right-0 px-2 text-lg leading-none text-gray-400 transition-colors hover:text-gray-900"
      >&times;</button>
    </div>

    <!-- x-effect for the same reason as on the shop's grid: the options arrive after the
         select is bound, and a browser does not pick an option that did not exist yet. -->
    <select
      x-model="category"
      x-effect="categories.length && ($el.value = category)"
      aria-label="Filter by category"
      class="input w-full sm:w-48"
    >
      <option value="">All categories</option>
      <template x-for="option in categories" :key="option.value">
        <option :value="option.value" x-text="option.label"></option>
      </template>
    </select>

    <select x-model="show" aria-label="Which products" class="input w-full sm:w-44">
      <option value="">All products</option>
      <option value="listed">In the shop</option>
      <option value="hidden">Hidden</option>
      <option value="low">Running low</option>
    </select>
  </div>

  <p x-show="error" x-text="error" role="alert" class="mb-4 rounded-lg bg-red-50 p-4 text-sm font-medium text-red-600"></p>

  <div x-show="pending" class="card divide-y divide-gray-200" aria-hidden="true">
    <template x-for="row in 8" :key="row">
      <div class="flex items-center gap-3 p-3">
        <div class="skeleton h-12 w-12 rounded-lg"></div>
        <div class="flex-1">
          <div class="skeleton h-3 w-1/3"></div>
          <div class="skeleton mt-2 h-2 w-1/4"></div>
        </div>
        <div class="skeleton h-4 w-16 rounded-full"></div>
      </div>
    </template>
  </div>

  <div x-show="!pending && !error && !products.length" class="card p-8 text-center">
    <p class="muted" x-text="q ? `No products match “${q}”.` : 'No products here.'"></p>
    <a x-show="!q && !category && !show" href="/admin/products/new" class="btn btn-primary mt-4">Add the first one</a>
  </div>

  <ul
    x-show="!pending && products.length"
    class="card divide-y divide-gray-200 overflow-hidden transition-opacity duration-200"
    :class="searching && 'opacity-60'"
  >
    <template x-for="product in products" :key="product.id">
      <li>
        <a :href="'/admin/products/' + product.id" class="flex flex-wrap items-center gap-x-4 gap-y-2 p-3 transition-colors hover:bg-gray-50">
          <span class="light-palette h-12 w-12 shrink-0 overflow-hidden rounded-lg bg-gray-100" :class="product.hidden && 'opacity-50'">
            <img :src="product.image" alt="" width="48" height="48" loading="lazy" class="h-full w-full object-cover">
          </span>

          <span class="min-w-0 flex-1 basis-40">
            <span class="block truncate text-sm font-medium text-gray-900" x-text="product.title"></span>
            <span class="muted block truncate text-xs" x-text="[product.brand, humanize(product.category)].filter(Boolean).join(' · ')"></span>
          </span>

          <span class="flex items-center gap-2">
            <span x-show="product.hidden" class="badge badge-soft">Hidden</span>
            <span class="badge" :class="stockBadge(product)" x-text="product.stock === 0 ? 'Sold out' : product.stock + ' in stock'"></span>
          </span>

          <span class="w-28 text-right text-sm tabular-nums">
            <span class="font-semibold text-gray-900" x-text="money(product.price, product.currency)"></span>
            <span x-show="product.regularPrice" class="block text-xs text-gray-400 line-through" x-text="money(product.regularPrice, product.currency)"></span>
          </span>
        </a>
      </li>
    </template>
  </ul>

  <div x-show="totalPages > 1" class="mt-4 flex items-center justify-center gap-3">
    <button type="button" class="btn btn-ghost btn-sm" :disabled="page <= 1" @click="goToPage(page - 1)">Previous</button>
    <span class="muted" x-text="'Page ' + page + ' of ' + totalPages"></span>
    <button type="button" class="btn btn-ghost btn-sm" :disabled="page >= totalPages" @click="goToPage(page + 1)">Next</button>
  </div>

</main>
