<main class="flex flex-1 items-center justify-center p-4" x-data="forgotPage">

  <template x-if="sent">
    <div class="card w-full max-w-sm p-6 text-center">
      <p class="eyebrow">Check your inbox</p>
      <h1 class="mt-2 text-lg font-semibold text-gray-900">The link is on its way.</h1>
      <p class="muted mt-2">
        If <span class="font-medium text-gray-900" x-text="values.email"></span> has an account, a reset link is in that inbox.
      </p>
      <button type="button" class="btn btn-ghost mt-6 w-full" @click="goTo('/login')">Back to sign in</button>
    </div>
  </template>

  <template x-if="!sent">
    <div class="card w-full max-w-sm p-6">
      <h1 class="text-lg font-semibold text-gray-900">Reset your password</h1>
      <p class="muted mt-1">We will email you a link to set a new one.</p>

      <form class="mt-5 flex flex-col gap-4" @submit.prevent="submit()" novalidate>
        <div>
          <label for="email" class="label">Email</label>
          <input
            id="email"
            x-init="$el.focus()"
            type="email"
            autocomplete="email"
            placeholder="ada@example.com"
            x-model="values.email"
            @input="clear('email')"
            :disabled="pending"
            class="input mt-1"
            :class="(errors.email || error) && 'border-red-400'"
          >
          <p class="mt-1 text-xs text-red-600" x-show="errors.email || error" x-text="errors.email || error"></p>
        </div>

        <button
          type="submit"
          class="btn btn-primary w-full"
          :disabled="pending"
          x-text="pending ? 'Sending…' : 'Send reset link'"
        ></button>
      </form>

      <p class="muted mt-5 text-center">
        <a href="/login" class="font-medium text-gray-900 underline underline-offset-2">Back to sign in</a>
      </p>
    </div>
  </template>

</main>
