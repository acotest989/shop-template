<main class="mx-auto w-full max-w-3xl p-4" x-data="checkoutPage">

  <!-- receipt -->
  <template x-if="order">
    <div class="card p-8 text-center">
      <p class="eyebrow" x-text="t('checkout.placed')"></p>
      <h1 class="mt-2 text-xl font-semibold text-gray-900" x-text="t('checkout.thanks', { name: order.customer.name })"></h1>
      <p class="muted mt-2">
        <span x-text="t('checkout.reference')"></span>
        <span class="font-mono text-gray-900" x-text="order.reference"></span> —
        <span x-text="t('checkout.totalTo', { total: money(order.total, order.currency), email: order.customer.email })"></span>
      </p>

      <p class="muted mt-2" x-show="!order.paid" x-text="t('checkout.payCourier', { total: money(order.total, order.currency) })"></p>

      <p class="muted mt-2" x-show="order.accountCreated" x-text="t('checkout.accountOpened', { email: order.customer.email })"></p>

      <button type="button" class="btn btn-primary mt-6" @click="goTo('/')" x-text="t('checkout.continue')"></button>
    </div>
  </template>

  <!-- nothing to pay for -->
  <template x-if="!order && $store.cart.count === 0">
    <div class="card p-8 text-center">
      <p class="muted" x-text="t('cart.empty')"></p>
      <button type="button" class="btn btn-primary mt-6" @click="goTo('/')" x-text="t('cart.browse')"></button>
    </div>
  </template>

  <template x-if="!order && $store.cart.count > 0">
    <div>
      <h1 class="mb-4 text-xl font-semibold text-gray-900" x-text="t('checkout.title')"></h1>

      <div class="grid gap-4 md:grid-cols-5">

        <form class="card flex flex-col gap-4 p-4 md:col-span-3" @submit.prevent="submit()" novalidate>
          <div>
            <label for="name" class="label" x-text="t('checkout.name')"></label>
            <input
              id="name"
              type="text"
              autocomplete="name"
              :placeholder="t('checkout.namePlaceholder')"
              x-model="values.name"
              @input="clear('name')"
              :disabled="pending"
              class="input mt-1"
              :class="errors.name && 'border-red-400'"
            >
            <p class="muted mt-1 text-xs" x-show="!errors.name" x-text="t('checkout.nameHint')"></p>
            <p class="mt-1 text-xs text-red-600" x-show="errors.name" x-text="errors.name"></p>
          </div>

          <div>
            <label for="email" class="label" x-text="t('checkout.email')"></label>
            <input
              id="email"
              type="email"
              autocomplete="email"
              :placeholder="t('checkout.emailPlaceholder')"
              x-model="values.email"
              @input="clear('email')"
              :disabled="pending"
              class="input mt-1"
              :class="errors.email && 'border-red-400'"
            >
            <p class="muted mt-1 text-xs" x-show="!errors.email" x-text="t('checkout.emailHint')"></p>
            <p class="mt-1 text-xs text-red-600" x-show="errors.email" x-text="errors.email"></p>
          </div>

          <div>
            <label for="phone" class="label" x-text="t('checkout.phone')"></label>
            <input
              id="phone"
              type="tel"
              inputmode="tel"
              autocomplete="tel"
              :placeholder="t('checkout.phonePlaceholder')"
              x-model="values.phone"
              @input="clear('phone')"
              :disabled="pending"
              class="input mt-1"
              :class="errors.phone && 'border-red-400'"
            >
            <p class="muted mt-1 text-xs" x-show="!errors.phone" x-text="t('checkout.phoneHint')"></p>
            <p class="mt-1 text-xs text-red-600" x-show="errors.phone" x-text="errors.phone"></p>
          </div>

          <div>
            <label for="address" class="label" x-text="t('checkout.address')"></label>
            <input
              id="address"
              type="text"
              autocomplete="street-address"
              :placeholder="t('checkout.addressPlaceholder')"
              x-model="values.address"
              @input="clear('address')"
              :disabled="pending"
              class="input mt-1"
              :class="errors.address && 'border-red-400'"
            >
            <p class="muted mt-1 text-xs" x-show="!errors.address" x-text="t('checkout.addressHint')"></p>
            <p class="mt-1 text-xs text-red-600" x-show="errors.address" x-text="errors.address"></p>
          </div>

          <fieldset :disabled="pending">
            <legend class="label" x-text="t('checkout.payment')"></legend>
            <div class="mt-1 grid gap-2 sm:grid-cols-2">
              <label
                class="card flex cursor-pointer items-start gap-3 p-3"
                :class="payment === 'cod' && 'ring-2 ring-brand'"
              >
                <input type="radio" name="payment" value="cod" x-model="payment" class="mt-0.5 accent-brand">
                <span>
                  <span class="block text-sm font-medium text-gray-900" x-text="t('checkout.cod')"></span>
                  <span class="muted text-xs" x-text="t('checkout.codHint')"></span>
                </span>
              </label>

                <!-- Off until a provider is wired in, and disabled rather than removed: the
                   record still knows the value and the hook still has the branch. -->
              <label
                class="card flex items-start gap-3 p-3"
                :class="{
                  'cursor-pointer': cardPayment,
                  'cursor-not-allowed opacity-60': !cardPayment,
                  'ring-2 ring-brand': payment === 'card',
                }"
              >
                <input
                  type="radio"
                  name="payment"
                  value="card"
                  x-model="payment"
                  :disabled="!cardPayment"
                  class="mt-0.5 accent-brand"
                >
                <span>
                  <span class="block text-sm font-medium text-gray-900" x-text="t('checkout.card')"></span>
                  <span
                    class="muted text-xs"
                    x-text="cardPayment ? t('checkout.cardSimulated') : t('checkout.cardUnavailable')"
                  ></span>
                </span>
              </label>
            </div>
          </fieldset>

          <p
            x-show="error"
            x-text="error"
            role="alert"
            aria-live="polite"
            class="rounded-lg bg-red-50 px-3 py-2 text-sm font-medium text-red-600"
          ></p>

          <button
            type="submit"
            class="btn btn-primary mt-2 w-full"
            :disabled="pending"
            x-text="pending ? t('checkout.placing') : t('checkout.place')"
          ></button>

          <p class="muted text-center text-xs" x-show="payment === 'card'" x-text="t('checkout.cardNote')"></p>
        </form>

        <aside class="card h-fit p-4 md:col-span-2">
          <p class="label" x-text="t('checkout.summary')"></p>

          <ul class="mt-3 flex flex-col gap-2">
            <template x-for="item in $store.cart.items" :key="item.id">
              <li class="flex gap-2 text-sm">
                <span class="min-w-0 flex-1 truncate text-gray-900" x-text="item.title"></span>
                <span class="muted shrink-0" x-text="'×' + item.qty"></span>
                <span
                  class="shrink-0 font-medium text-gray-900"
                  x-text="money(item.price * item.qty, item.currency)"
                ></span>
              </li>
            </template>
          </ul>

          <div class="mt-4 flex justify-between border-t border-gray-200 pt-3 text-sm">
            <span class="muted" x-text="t('checkout.shipping')"></span>
            <span
              class="font-medium text-gray-900"
              x-text="$store.cart.shipping ? money($store.cart.shipping, $store.cart.currency) : t('checkout.free')"
            ></span>
          </div>

          <div class="mt-2 flex items-baseline justify-between">
            <span class="text-sm font-medium text-gray-900" x-text="t('checkout.total')"></span>
            <span
              class="text-lg font-semibold text-gray-900"
              x-text="money($store.cart.total, $store.cart.currency)"
            ></span>
          </div>

          <button type="button" class="btn btn-ghost mt-4 w-full" @click="goTo('/cart')" x-text="t('checkout.editCart')"></button>
        </aside>

      </div>
    </div>
  </template>

</main>
