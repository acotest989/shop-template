<!-- No x-data: the cart is a store, so this page has no state of its own. -->
<main class="mx-auto w-full max-w-3xl p-4">
  <h1 class="mb-4 text-xl font-semibold text-gray-900">Cart</h1>

  <template x-if="$store.cart.items.length === 0">
    <div class="card p-8 text-center">
      <p class="muted">Your cart is empty.</p>
      <button type="button" class="btn btn-primary mt-6" @click="goTo('/')">Browse products</button>
    </div>
  </template>

  <template x-if="$store.cart.items.length > 0">
    <div>
      <ul class="card divide-y divide-gray-200">
        <template x-for="item in $store.cart.items" :key="item.id">
          <li class="flex gap-4 p-3">

            <a :href="'/products/' + item.handle" class="shrink-0">
              <img
                :src="item.image"
                :alt="item.title"
                width="80"
                height="80"
                loading="lazy"
                class="h-20 w-20 rounded-lg bg-gray-100 object-cover"
              >
            </a>

            <div class="flex min-w-0 flex-1 flex-col">
              <a
                :href="'/products/' + item.handle"
                class="line-clamp-2 text-sm font-medium text-gray-900 transition-colors hover:text-gray-500"
                x-text="item.title"
              ></a>
              <span class="muted mt-0.5" x-text="money(item.price, item.currency)"></span>

              <div class="mt-auto flex flex-wrap items-center gap-x-3 gap-y-2 pt-2">
                <div class="flex items-center rounded-lg border border-gray-300">
                  <button
                    type="button"
                    class="btn btn-sm px-2.5 text-gray-500 hover:text-gray-900"
                    :aria-label="'Decrease quantity of ' + item.title"
                    @click="$store.cart.setQty(item.id, item.qty - 1)"
                  >&minus;</button>

                  <span class="w-8 text-center text-sm font-medium" x-text="item.qty"></span>

                  <button
                    type="button"
                    class="btn btn-sm px-2.5 text-gray-500 hover:text-gray-900 disabled:text-gray-300"
                    :disabled="item.qty >= item.stock"
                    :aria-label="'Increase quantity of ' + item.title"
                    @click="$store.cart.setQty(item.id, item.qty + 1)"
                  >+</button>
                </div>

                <button
                  type="button"
                  class="text-xs text-gray-400 underline-offset-2 transition-colors hover:text-red-600 hover:underline"
                  :aria-label="'Remove ' + item.title + ' from cart'"
                  @click="$store.cart.remove(item.id)"
                >Remove</button>

                <span
                  class="ml-auto text-sm font-semibold text-gray-900"
                  x-text="money(item.price * item.qty, item.currency)"
                ></span>
              </div>
            </div>

          </li>
        </template>
      </ul>

      <div class="card mt-4 p-4">
        <div class="flex items-baseline justify-between">
          <span class="text-sm font-medium text-gray-900">Subtotal</span>
          <span
            class="text-lg font-semibold text-gray-900"
            x-text="money($store.cart.subtotal, $store.cart.currency)"
          ></span>
        </div>
        <p class="muted mt-1 text-xs">VAT included. Shipping is free.</p>

        <div class="mt-4 flex flex-wrap gap-3">
          <button type="button" class="btn btn-primary flex-1" @click="goTo('/checkout')">Checkout</button>
          <button type="button" class="btn btn-ghost" @click="goBack()">Back</button>
          <button type="button" class="btn btn-ghost" @click="$store.cart.clear()">Clear cart</button>
        </div>
      </div>
    </div>
  </template>
</main>
