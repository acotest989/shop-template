<main class="flex flex-1 items-center justify-center p-4" x-data="resetPage">

  <template x-if="done">
    <div class="card w-full max-w-sm p-6 text-center">
      <p class="eyebrow" x-text="t('reset.changed')"></p>
      <h1 class="mt-2 text-lg font-semibold text-gray-900" x-text="t('reset.useNew')"></h1>
      <p class="muted mt-2" x-text="t('reset.signedOut')"></p>
      <button type="button" class="btn btn-primary mt-6 w-full" @click="goTo('/login')" x-text="t('nav.signIn')"></button>
    </div>
  </template>

  <template x-if="!done">
    <div class="card w-full max-w-sm p-6">
      <h1 class="text-lg font-semibold text-gray-900" x-text="t('reset.title')"></h1>

      <form class="mt-5 flex flex-col gap-4" @submit.prevent="submit()" novalidate>
        <div>
          <label for="password" class="label" x-text="t('reset.newPassword')"></label>
          <input
            id="password"
            x-init="$el.focus()"
            type="password"
            autocomplete="new-password"
            x-model="values.password"
            @input="clear('password')"
            :disabled="pending"
            class="input mt-1"
            :class="errors.password && 'border-red-400'"
          >
          <p class="muted mt-1 text-xs" x-show="!errors.password" x-text="t('validation.passwordLength', { n: 8 })"></p>
          <p class="mt-1 text-xs text-red-600" x-show="errors.password" x-text="errors.password"></p>
        </div>

        <div>
          <label for="passwordConfirm" class="label" x-text="t('register.repeatPassword')"></label>
          <input
            id="passwordConfirm"
            type="password"
            autocomplete="new-password"
            x-model="values.passwordConfirm"
            @input="clear('passwordConfirm')"
            :disabled="pending"
            class="input mt-1"
            :class="errors.passwordConfirm && 'border-red-400'"
          >
          <p class="mt-1 text-xs text-red-600" x-show="errors.passwordConfirm" x-text="errors.passwordConfirm"></p>
        </div>

        <p
          x-show="error"
          x-text="error"
          role="alert"
          aria-live="polite"
          class="rounded-lg bg-red-50 px-3 py-2 text-sm font-medium text-red-600"
        ></p>

        <button
          type="submit"
          class="btn btn-primary w-full"
          :disabled="pending"
          x-text="pending ? t('common.saving') : t('reset.submit')"
        ></button>
      </form>
    </div>
  </template>

</main>
