<main class="flex flex-1 items-center justify-center p-4" x-data="resetPage">

  <template x-if="done">
    <div class="card w-full max-w-sm p-6 text-center">
      <p class="eyebrow">Password changed</p>
      <h1 class="mt-2 text-lg font-semibold text-gray-900">Use the new one to sign in.</h1>
      <p class="muted mt-2">Changing a password signs out every device that was using the old one.</p>
      <button type="button" class="btn btn-primary mt-6 w-full" @click="goTo('/login')">Sign in</button>
    </div>
  </template>

  <template x-if="!done">
    <div class="card w-full max-w-sm p-6">
      <h1 class="text-lg font-semibold text-gray-900">Set a new password</h1>

      <form class="mt-5 flex flex-col gap-4" @submit.prevent="submit()" novalidate>
        <div>
          <label for="password" class="label">New password</label>
          <input
            id="password"
            x-init="$el.focus()"
            type="password"
            autocomplete="new-password"
            x-model="password"
            @input="errors.password = ''"
            :disabled="pending"
            class="input mt-1"
            :class="errors.password && 'border-red-400'"
          >
          <p class="muted mt-1 text-xs" x-show="!errors.password">At least 8 characters.</p>
          <p class="mt-1 text-xs text-red-600" x-show="errors.password" x-text="errors.password"></p>
        </div>

        <div>
          <label for="passwordConfirm" class="label">Repeat password</label>
          <input
            id="passwordConfirm"
            type="password"
            autocomplete="new-password"
            x-model="passwordConfirm"
            @input="errors.passwordConfirm = ''"
            :disabled="pending"
            class="input mt-1"
            :class="errors.passwordConfirm && 'border-red-400'"
          >
          <p class="mt-1 text-xs text-red-600" x-show="errors.passwordConfirm" x-text="errors.passwordConfirm"></p>
        </div>

        <p
          x-show="error"
          x-text="error"
          role="alert"
          aria-live="polite"
          class="rounded-lg bg-red-50 px-3 py-2 text-sm font-medium text-red-600"
        ></p>

        <button
          type="submit"
          class="btn btn-primary w-full"
          :disabled="pending"
          x-text="pending ? 'Saving…' : 'Save password'"
        ></button>
      </form>
    </div>
  </template>

</main>
