<main class="mx-auto w-full max-w-5xl p-4" x-data="productPage">

  <template x-if="pending">
    <div class="grid gap-8 md:grid-cols-2" aria-hidden="true">
      <div class="skeleton aspect-square w-full rounded-xl"></div>
      <div class="pt-2">
        <div class="skeleton h-2 w-1/4"></div>
        <div class="skeleton mt-3 h-6 w-3/4"></div>
        <div class="skeleton mt-4 h-5 w-1/3"></div>
        <div class="skeleton mt-8 h-10 w-40 rounded-lg"></div>
      </div>
    </div>
  </template>

  <template x-if="error">
    <div class="p-8 text-center">
      <p class="rounded-lg bg-red-50 p-4 text-sm font-medium text-red-600" x-text="error"></p>
      <button type="button" class="btn btn-primary mt-6" @click="goTo('/')">Back to products</button>
    </div>
  </template>

  <template x-if="product">
    <div class="grid gap-8 md:grid-cols-2">
      <div class="card relative aspect-square overflow-hidden bg-gray-100">
        <img
          :src="product.image"
          :alt="product.title"
          width="600"
          height="600"
          class="h-full w-full object-cover"
          :class="{ 'opacity-60': !product.available }"
        >
        <span
          x-show="discountPercent(product.price, product.regularPrice) > 0"
          x-text="'-' + discountPercent(product.price, product.regularPrice) + '%'"
          class="badge badge-ink absolute left-3 top-3"
        ></span>
      </div>

      <div class="flex flex-col">
        <p class="eyebrow" x-text="product.brand"></p>
        <h1 class="mt-1 text-2xl font-semibold text-gray-900" x-text="product.title"></h1>

        <p class="mt-2 flex items-center gap-1.5 text-sm text-gray-500">
          <!-- One row of stars over another, the top one clipped to the score. -->
          <span class="relative leading-none" aria-hidden="true">
            <span class="text-gray-300">&#9733;&#9733;&#9733;&#9733;&#9733;</span>
            <span
              class="absolute inset-y-0 left-0 overflow-hidden whitespace-nowrap text-amber-400"
              :style="'width: ' + starPercent(product.rating) + '%'"
            >&#9733;&#9733;&#9733;&#9733;&#9733;</span>
          </span>
          <span x-text="product.rating.toFixed(1)"></span>
          <span class="sr-only">out of 5</span>
          <span x-show="product.sold" x-text="'· ' + product.sold + ' sold'"></span>
        </p>

        <div class="mt-4 flex items-baseline gap-3">
          <span class="text-2xl font-semibold text-gray-900" x-text="money(product.price, product.currency)"></span>
          <span
            x-show="product.regularPrice"
            class="text-gray-400 line-through"
            x-text="money(product.regularPrice, product.currency)"
          ></span>
        </div>

        <p
          x-show="product.available && product.stock <= 3"
          class="badge badge-warn mt-3 self-start"
          x-text="'Only ' + product.stock + ' left'"
        ></p>

        <div class="mt-4 flex flex-wrap items-center gap-2">
          <template x-for="tag in product.tags" :key="tag">
            <a
              :href="'/?q=' + encodeURIComponent(tag)"
              :aria-label="'Search for ' + tag"
              class="tag"
              x-text="tag"
            ></a>
          </template>
        </div>

        <div class="mt-8 flex flex-wrap items-center gap-3">
          <div class="flex items-center rounded-lg border border-gray-300" x-show="product.available">
            <button
              type="button"
              class="btn btn-sm px-2.5 text-gray-500 hover:text-gray-900 disabled:text-gray-300"
              :disabled="!inCart && qty <= 1"
              aria-label="Decrease quantity"
              @click="step(-1)"
            >&minus;</button>

            <span class="w-8 text-center text-sm font-medium" x-text="shownQty"></span>

            <button
              type="button"
              class="btn btn-sm px-2.5 text-gray-500 hover:text-gray-900 disabled:text-gray-300"
              :disabled="shownQty >= product.stock"
              aria-label="Increase quantity"
              @click="step(1)"
            >+</button>
          </div>

          <!-- One button, three states. Once the cart holds this product the stepper writes
               to it directly, so adding again would say nothing the count does not. -->
          <button
            type="button"
            class="btn btn-primary flex-1"
            :disabled="!product.available"
            x-text="!product.available ? 'Sold out' : inCart ? `View cart (${$store.cart.count})` : 'Add to cart'"
            @click="inCart ? goTo('/cart') : addToCart()"
          ></button>
          <button type="button" class="btn btn-ghost" @click="goBack()">Back</button>
        </div>
      </div>
    </div>
  </template>

</main>
