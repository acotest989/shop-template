<main class="mx-auto w-full max-w-5xl p-4" x-data="productPage">

  <template x-if="pending">
    <div class="grid gap-8 md:grid-cols-2" aria-hidden="true">
      <div class="skeleton aspect-square w-full rounded-xl"></div>
      <div class="pt-2">
        <div class="skeleton h-2 w-1/4"></div>
        <div class="skeleton mt-3 h-6 w-3/4"></div>
        <div class="skeleton mt-4 h-5 w-1/3"></div>
        <div class="skeleton mt-8 h-10 w-40 rounded-lg"></div>
      </div>
    </div>
  </template>

  <template x-if="error">
    <div class="p-8 text-center">
      <p class="rounded-lg bg-red-50 p-4 text-sm font-medium text-red-600" x-text="error"></p>
      <button type="button" class="btn btn-primary mt-6" @click="goTo('/')">Back to products</button>
    </div>
  </template>

  <template x-if="product">
    <div class="grid gap-8 md:grid-cols-2">
      <div>
        <!-- Framed like a card on the grid: the frame takes the page's palette, while the
             ground under the picture, and the badge on it, keep the light one. -->
        <div class="card relative aspect-square overflow-hidden">
          <div class="light-palette h-full w-full bg-gray-100">
            <img
              :src="product.images[shown]"
              :alt="product.title"
              width="600"
              height="600"
              class="h-full w-full object-cover"
              :class="{ 'opacity-60': !product.available, 'cursor-pointer': product.images.length > 1 }"
              @click="nextImage()"
            >
            <span
              x-show="discountPercent(product.price, product.regularPrice) > 0"
              x-text="'-' + discountPercent(product.price, product.regularPrice) + '%'"
              class="badge badge-ink absolute left-3 top-3"
            ></span>
          </div>
        </div>

        <!-- Not drawn for a product with one picture: a row of one is a control that
             does nothing, and three or four fit here without hiding any of them.
             The light ground goes on the picture, not the button, so the border that marks
             the one on show keeps the page's palette and stays visible in dark mode. -->
        <div class="mt-3 flex flex-wrap gap-2" x-show="product.images.length > 1">
          <template x-for="(src, index) in product.images" :key="src">
            <button
              type="button"
              class="aspect-square w-16 overflow-hidden rounded-lg border bg-gray-100 transition-colors"
              :class="index === shown ? 'border-brand' : 'border-gray-200 hover:border-gray-400'"
              :aria-label="'Show picture ' + (index + 1) + ' of ' + product.images.length"
              :aria-current="index === shown"
              @click="shown = index"
            >
              <img :src="src" alt="" width="64" height="64" loading="lazy" class="light-palette h-full w-full bg-gray-100 object-cover">
            </button>
          </template>
        </div>
      </div>

      <div class="flex flex-col">
        <p class="eyebrow" x-text="product.brand"></p>
        <h1 class="mt-1 text-2xl font-semibold text-gray-900" x-text="product.title"></h1>

        <p class="mt-2 flex items-center gap-1.5 text-sm text-gray-500">
          <!-- One row of stars over another, the top one clipped to the score. -->
          <span class="relative leading-none" aria-hidden="true">
            <span class="text-gray-300">&#9733;&#9733;&#9733;&#9733;&#9733;</span>
            <span
              class="absolute inset-y-0 left-0 overflow-hidden whitespace-nowrap text-amber-400"
              :style="'width: ' + starPercent(product.rating) + '%'"
            >&#9733;&#9733;&#9733;&#9733;&#9733;</span>
          </span>
          <span x-text="product.rating.toFixed(1)"></span>
          <span class="sr-only">out of 5</span>
          <span x-show="product.sold" x-text="'· ' + product.sold + ' sold'"></span>
        </p>

        <div class="mt-4 flex items-baseline gap-3">
          <span class="text-2xl font-semibold text-gray-900" x-text="money(product.price, product.currency)"></span>
          <span
            x-show="product.regularPrice"
            class="text-gray-400 line-through"
            x-text="money(product.regularPrice, product.currency)"
          ></span>
        </div>

        <p
          x-show="product.available && product.stock <= 3"
          class="badge badge-warn mt-3 self-start"
          x-text="'Only ' + product.stock + ' left'"
        ></p>

        <p
          x-show="product.description"
          x-text="product.description"
          class="mt-4 text-sm leading-relaxed text-gray-600"
        ></p>

        <div class="mt-4 flex flex-wrap items-center gap-2">
          <template x-for="tag in product.tags" :key="tag">
            <a
              :href="'/?q=' + encodeURIComponent(tag)"
              :aria-label="'Search for ' + tag"
              class="tag"
              x-text="tag"
            ></a>
          </template>
        </div>

        <!-- On a phone the gallery pushes these below the first screen, so there they are a bar
             fixed to the bottom of it, in one row: Back goes, since the phone has its own, and
             the chat keeps only its icon. From md up they sit in the page, in two rows.
             `buy-bar` is what makes room for the bar, in assets/theme.css. -->
        <div
          class="buy-bar flex items-center gap-3
                 max-md:fixed max-md:inset-x-0 max-md:bottom-0 max-md:z-20 max-md:border-t max-md:border-gray-200 max-md:bg-white max-md:p-3
                 md:mt-8 md:grid md:grid-cols-2"
        >
          <div class="flex min-w-0 flex-1 items-center gap-3 md:col-span-2">
            <div class="flex items-center rounded-lg border border-gray-300" x-show="product.available">
              <button
                type="button"
                class="btn btn-sm px-2.5 text-gray-500 hover:text-gray-900 disabled:text-gray-300"
                :disabled="!inCart && qty <= 1"
                aria-label="Decrease quantity"
                @click="step(-1)"
              >&minus;</button>

              <span class="w-8 text-center text-sm font-medium" x-text="shownQty"></span>

              <button
                type="button"
                class="btn btn-sm px-2.5 text-gray-500 hover:text-gray-900 disabled:text-gray-300"
                :disabled="shownQty >= $store.cart.maxQty(product)"
                aria-label="Increase quantity"
                @click="step(1)"
              >+</button>
            </div>

            <!-- One button, three states. Once the cart holds this product the stepper writes
                 to it directly, so adding again would say nothing the count does not. -->
            <button
              type="button"
              class="btn btn-primary flex-1"
              :disabled="!product.available"
              x-text="!product.available ? 'Sold out' : inCart ? `View cart (${$store.cart.count})` : 'Add to cart'"
              @click="inCart ? goTo('/cart') : addToCart()"
            ></button>
          </div>

          <!-- The two quiet actions, under the one that sells. Asking stays when the product
               is sold out, which is when a visitor most wants to know more. -->
          <button type="button" class="btn btn-ghost max-md:hidden" @click="goBack()">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
            </svg>
            Back
          </button>
          <div class="shrink-0" x-html="partials.chat"></div>
        </div>
      </div>
    </div>
  </template>

</main>
