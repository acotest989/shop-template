<main class="mx-auto w-full max-w-6xl p-4" x-data="adminPage">

  <template x-if="$store.session.user?.admin">
    <div>
      <h1 class="mb-4 text-xl font-semibold text-gray-900">Overview</h1>

      <p x-show="error" x-text="error" role="alert" class="mb-4 rounded-lg bg-red-50 p-4 text-sm font-medium text-red-600"></p>

      <div x-show="pending" class="grid gap-4 sm:grid-cols-3" aria-hidden="true">
        <template x-for="tile in 3" :key="tile">
          <div class="card p-4">
            <div class="skeleton h-2 w-1/2"></div>
            <div class="skeleton mt-4 h-7 w-12"></div>
          </div>
        </template>
      </div>

      <template x-if="overview">
        <div>
          <!-- Each figure is a link to the list behind it. -->
          <div class="grid gap-4 sm:grid-cols-3">
            <a href="/admin/inbox" class="card block p-4 transition-shadow hover:shadow-md">
              <p class="label">Waiting for an answer</p>
              <p class="mt-2 text-3xl font-semibold tabular-nums" :class="overview.waiting ? 'text-amber-600' : 'text-gray-900'" x-text="overview.waiting"></p>
              <p class="muted mt-1 text-xs" x-text="overview.waiting === 1 ? 'conversation in the inbox' : 'conversations in the inbox'"></p>
            </a>

            <a href="/admin/orders" class="card block p-4 transition-shadow hover:shadow-md">
              <p class="label">Orders today</p>
              <p class="mt-2 text-3xl font-semibold tabular-nums text-gray-900" x-text="overview.today"></p>
              <p class="muted mt-1 text-xs">placed since midnight</p>
            </a>

            <a href="/admin/orders?status=pending" class="card block p-4 transition-shadow hover:shadow-md">
              <p class="label">Pending</p>
              <p class="mt-2 text-3xl font-semibold tabular-nums" :class="overview.pending ? 'text-amber-600' : 'text-gray-900'" x-text="overview.pending"></p>
              <p class="muted mt-1 text-xs" x-text="overview.pending === 1 ? 'order not shipped yet' : 'orders not shipped yet'"></p>
            </a>
          </div>

          <section class="card mt-4 p-4">
            <div class="flex flex-wrap items-baseline gap-x-2">
              <h2 class="label">Running low</h2>
              <span class="muted text-xs" x-text="lowStock + ' or fewer left'"></span>
              <span
                x-show="overview.lowStock.count"
                class="badge badge-warn ml-auto"
                x-text="overview.lowStock.count === 1 ? '1 product' : overview.lowStock.count + ' products'"
              ></span>
            </div>

            <p x-show="!overview.lowStock.count" class="muted mt-3" x-text="'Every product has more than ' + lowStock + ' left.'"></p>

            <ul class="mt-2 divide-y divide-gray-200" x-show="overview.lowStock.count">
              <template x-for="product in overview.lowStock.items" :key="product.id">
                <li class="flex items-center gap-3 py-2">
                  <span class="light-palette h-10 w-10 shrink-0 overflow-hidden rounded-lg bg-gray-100">
                    <img :src="product.image" alt="" width="40" height="40" loading="lazy" class="h-full w-full object-cover">
                  </span>
                  <a :href="'/admin/products/' + product.id" class="min-w-0 flex-1 truncate text-sm text-gray-900 hover:underline" x-text="product.title"></a>
                  <span class="badge shrink-0" :class="product.stock > 0 ? 'badge-warn' : 'badge-bad'" x-text="product.stock > 0 ? product.stock + ' left' : 'Sold out'"></span>
                </li>
              </template>
            </ul>

            <a
              x-show="overview.lowStock.count"
              href="/admin/products?show=low"
              class="mt-2 inline-block text-xs font-medium text-gray-600 underline underline-offset-2 hover:text-gray-900"
              x-text="overview.lowStock.count > overview.lowStock.items.length
                ? 'See all ' + overview.lowStock.count + ' in Products'
                : 'See them in Products'"
            ></a>
          </section>
        </div>
      </template>
    </div>
  </template>

</main>
